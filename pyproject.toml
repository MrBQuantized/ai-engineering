[project]
name = "ai-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MrBQuantized", email = "onohblessing24@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langchain-postgres>=0.0.19",
    "langsmith>=0.14.7",
    "openai>=3.29.0",
    "pgvector>=0.2.5,<0.4",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "xai-sdk>=1.20.0",
]


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "D"] # Enable Pyflakes, pycdestyle, isort
ignore = [
    "D100", "D101", "D102", "D103", "D104",
    "D203", # incompatible with D211
    "D213"  # incompatible with D212
    ]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
